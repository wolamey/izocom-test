name: izocom-backend-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
    healthcheck:
         test: ["CMD-SHELL" , "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
         interval: 5s
         timeout: 5s
         retries: 10
         start_period: 10s
  api:
    build:
        context: .
        dockerfile: Dockerfile
    image: izocom-api:local
    environment:
      APP_NAME: ${APP_NAME:-Изоком Пласт API}
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
     db:
      condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=6)"
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
